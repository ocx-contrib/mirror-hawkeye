extends: ../mirror-base.yml

name: hawkeye

# Logical index package `hawkeye/hawkeye` at the physical path
# `ghcr.io/ocx-contrib/hawkeye/hawkeye` — slash segments, never hyphen-
# flattened. The first segment must be this repo's own GitHub owner:
# GITHUB_TOKEN only authorises packages owned by the repo the workflow runs in.
#
# Tool-as-namespace: upstream's owner is `korandoru`, which means nothing to
# someone who does not already know the tool, so the tool names itself — the
# same rule that gave `elvish/elvish` and `lychee/lychee`.
#
# Succeeds the flat `ocx.sh/hawkeye` coordinate this repository published
# before the grouped layout.
target:
  registry: ghcr.io
  repository: ocx-contrib/hawkeye/hawkeye

source:
  type: github_release
  owner: korandoru
  repo: hawkeye
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# hawkeye is a Rust build and upstream ships BOTH `-unknown-linux-gnu` and
# `-unknown-linux-musl` per arch. This mirror carries the MUSL one on both
# arches. Measured on v6.5.1:
#
#   hawkeye-x86_64-unknown-linux-musl
#     $ file    → ELF 64-bit LSB pie executable, x86-64, static-pie linked
#     $ readelf -l … | grep INTERP → (none)
#     $ readelf -d … | grep NEEDED → (none)
#   hawkeye-aarch64-unknown-linux-musl
#     $ file    → ELF 64-bit LSB executable, ARM aarch64, statically linked
#     no INTERP, no NEEDED
#
#   hawkeye-x86_64-unknown-linux-gnu   (NOT mirrored)
#     interpreter /lib64/ld-linux-x86-64.so.2
#     NEEDED libgcc_s.so.1, libm.so.6, libc.so.6, ld-linux-x86-64.so.2
#   hawkeye-aarch64-unknown-linux-gnu  (NOT mirrored)
#     interpreter /lib/ld-linux-aarch64.so.1
#     NEEDED libgcc_s.so.1, libm.so.6, libc.so.6
#
# Two consequences, both deliberate:
#
#  1. The gnu twin is DROPPED. Owner rule 2026-08-02: where upstream ships both
#     a fully-static and a dynamic build, publish only the static one. The
#     earlier flat spec selected the gnu tarballs with the rationale "matches
#     the other gnu-libc tools in this fleet" — that is a build-provenance
#     preference, not a host requirement, and it made the mirror depend on
#     `libgcc_s.so.1` being present for no gain.
#
#  2. Both Linux keys are BARE — no `+libc.*` suffix. No PT_INTERP and no
#     DT_NEEDED means the artifact requires nothing of the host, and
#     `os.features` states requirements, not provenance. `+libc.musl` here
#     would be a FALSE requirement claim that hid the package from every glibc
#     host. Container legs (ubuntu + alpine + fedora) live in
#     ../mirror-base.yml and are what turn "requires nothing" into evidence.
#
# ─── Scope (verified against v6.3.0, the first in-range release, and v6.5.1)
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   hawkeye-*-unknown-linux-gnu.tar.xz   — dynamic twin of a static build
#   *.sha256                             — digest sidecars
#   hawkeye-installer.sh, dist-manifest.json, source.tar.gz  — installer, meta
#
# The anchored ^…$ regexes are what keep those out — `…-musl\.tar\.xz$` does
# not match the `.sha256` sidecar. Resolution verified BOTH ways across EVERY
# in-range release (all 6 of v6.3.0, v6.4.0, v6.4.1, v6.4.2, v6.5.0, v6.5.1):
# each of the five patterns matches EXACTLY one asset. A pattern matching zero
# is silently skipped, not an error — it would yield a green run with a
# missing platform.
assets:
  linux/amd64:
    - "^hawkeye-x86_64-unknown-linux-musl\\.tar\\.xz$"
  linux/arm64:
    - "^hawkeye-aarch64-unknown-linux-musl\\.tar\\.xz$"
  darwin/amd64:
    - "^hawkeye-x86_64-apple-darwin\\.tar\\.xz$"
  darwin/arm64:
    - "^hawkeye-aarch64-apple-darwin\\.tar\\.xz$"
  windows/amd64:
    - "^hawkeye-x86_64-pc-windows-msvc\\.zip$"

# The linux/darwin `.tar.xz` wraps its payload in a `hawkeye-<triple>/`
# directory (binary + LICENSE + README + CHANGELOG at the wrapper root, no
# bin/) → strip_components: 1. The Windows zip is FLAT — `hawkeye.exe` sits at
# the archive root — so it needs strip_components: 0, or the binary itself
# would be stripped. Verified on both v6.3.0 and v6.5.1.
asset_type:
  default:
    type: archive
    strip_components: 1
  platforms:
    windows/amd64:
      type: archive
      strip_components: 0

# `off`, and it cannot be otherwise here. After stripping, `hawkeye` lands
# directly AT the content root, so the bundle's only PATH entry is a bare
# `${installPath}`. The scan only looks BELOW an interface PATH entry of the
# form ${installPath}/<dir>, so `auto`/`verify` is rejected at spec load with
# exit 65 ("bin_scan is enabled but … declares no interface-visible
# ${installPath}/<dir> PATH entry"). `off` plus a hand-listed `binaries` in
# metadata.json is the blessed shape for this layout.
bin_scan: off

metadata:
  # Paths resolve against THIS spec's directory, not the repo root. One file
  # serves all five platforms: `hawkeye`/`hawkeye.exe` is at the content root
  # on every one.
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  # 6.3.0 is where `-unknown-linux-musl` FIRST SHIPS. v6.0.4–v6.2.0 publish the
  # gnu tarballs only, so a musl-selecting spec resolves zero Linux assets on
  # them — silently skipped, not an error, which is exactly the green-run-with-
  # missing-platform failure the floor exists to prevent. Raising the floor is
  # preferred over version-keyed alternatives that would reintroduce the
  # dynamic gnu build for the older half of the range. (The previous floor of
  # 6.0.4 was set by the same reasoning one asset earlier: linux/arm64 gnu
  # first shipped there.)
  min: "6.3.0"
  new_per_run: 10
  poll_interval: "56 4-23/6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: hawkeye/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/korandoru/hawkeye/license --jq '.license.spdx_id'
  #   Apache-2.0
  # Corroborated by the `LICENSE` file shipped inside every release tarball
  # ("Apache License, Version 2.0").
  org.opencontainers.image.licenses: "Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: hawkeye/hawkeye
  fork: ocx-contrib/index
